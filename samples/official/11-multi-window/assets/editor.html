<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTML Editor</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }

      #editor {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        resize: none;
        padding: 12px;
        background: #1e1e1e;
        color: #d4d4d4;
        font: 13px/1.5 monospace;
        tab-size: 2;
      }
    </style>
  </head>
  <body>
    <textarea id="editor" aria-label="HTML source" spellcheck="false"
              autocapitalize="off" autocomplete="off" wrap="off"></textarea>

    <script>
      // The starting document: a small self-contained page. Whatever you type here
      // renders live in the preview window.
      const html = `<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI Variable Display", "SF Pro Display",
                   "Segoe UI", sans-serif;
      color: #f2f1fbd9;
      background-color: #0a0b1c;
      background-image:
        radial-gradient(at 20% 30%, #9646eb40, transparent 50%),
        radial-gradient(at 80% 40%, #466ef038, transparent 50%),
        radial-gradient(at 55% 100%, #483ce133, transparent 55%);
    }

    .card {
      padding: 40px 56px;
      text-align: center;
      border-radius: 28px;
      background-color: #ffffff12;
      box-shadow: inset 0 0 0 1px #ffffff1c,
                  inset 0 1px 0 #ffffff29;
      backdrop-filter: saturate(1.8) blur(20px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 36px;
      font-weight: 300;
      text-shadow: 0 0 4px #c9c2ff80, 0 0 12px #c9c2ff59;
    }

    p {
      margin: 0;
      font-weight: 300;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, Ultralight!</h1>
    <p>Edit me on the left; I re-render as you type.</p>
  </div>
</body>
</html>
`;

      const editor = document.getElementById('editor');
      editor.value = html;

      // Send the initial document, then debounce edits into one preview update.
      let pending = 0;
      const pushContent = () => native.updateEditor(editor.value);
      editor.addEventListener('input', () => {
        clearTimeout(pending);
        pending = setTimeout(pushContent, 200);
      });
      pushContent();
    </script>
  </body>
</html>
