name: Build
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # GLAD in the pinned vcpkg baseline still declares CMake 3.0 policies.
      # Pass the compatibility setting to dependency builds as well as the main project.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      VCPKG_KEEP_ENV_VARS: CMAKE_POLICY_VERSION_MINIMUM
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 / MSVC
            os: windows-2022
            triplet: x64-windows
            env: {}
            args: "['-DENABLE_TEST=ON', '-DCMAKE_BUILD_TYPE=Release']"
          - name: Linux x64 / GCC
            os: ubuntu-24.04
            triplet: x64-linux
            env:
              CC: gcc-13
              CXX: g++-13
            args: "['-DENABLE_TEST=ON', '-DCMAKE_BUILD_TYPE=Release']"
          - name: macOS arm64 / Clang
            os: macos-15
            triplet: arm64-osx
            env: {}
            args: "['-DENABLE_TEST=ON', '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_OSX_ARCHITECTURES=arm64', '-DULBIND17_ALLOW_UNAVAILABLE_GRAPHICS=ON']"

    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqq build-essential pkg-config gcc-13 g++-13 libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev xvfb
      - uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
      - uses: lukka/run-cmake@v10
        with:
          configurePreset: default
          configurePresetAdditionalArgs: ${{ matrix.args }}
          buildPreset: default
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
          CC: ${{ matrix.env.CC }}
          CXX: ${{ matrix.env.CXX }}
      - name: Test Linux (including hidden-window GUI smoke)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build/Linux -C Release --output-on-failure
      - name: Test Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build/Windows -C Release --output-on-failure
      - name: Test macOS
        if: runner.os == 'macOS'
        run: ctest --test-dir build/Darwin -C Release --output-on-failure
